# Copy .env.sample to .env and fill it in, then: docker compose up -d --build
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?set SQL_SA_PASSWORD in .env}
    volumes:
      - sqldata:/var/opt/mssql
    restart: unless-stopped

  api:
    build: .
    depends_on:
      - sql
    environment:
      ConnectionStrings__Default: "Server=sql,1433;Database=CallRecordings;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=True"
      Auth__ApiKey: ${API_KEY:?set API_KEY in .env}
      Database__MigrateOnStartup: "true"
      Storage__MaxUploadBytes: "209715200"
    volumes:
      - recordings:/data/recordings
    restart: unless-stopped

  # Terminates HTTPS with an automatic Let's Encrypt certificate for $DOMAIN.
  caddy:
    image: caddy:2
    depends_on:
      - api
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  sqldata:
  recordings:
  caddy_data:
  caddy_config:
