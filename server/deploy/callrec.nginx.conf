server {
    server_name recordings.lilliblush.com;

    # Recordings can be long; matches Storage__MaxUploadBytes (200 MB) plus form overhead.
    client_max_body_size 210m;
    # Stream uploads straight to the API instead of spooling them to nginx's temp folder first.
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:5025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    listen 80;
}
